<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Spare - Genuine Auto Spare Parts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-gray-50">
<!-- Navbar -->
<nav class="bg-black text-white p-4 flex justify-between items-center sticky top-0 z-50">
  <h1 class="text-xl font-bold">TRUST <span class="text-yellow-400">SPARE</span></h1>
  <div class="flex gap-4 items-center">
    <input id="search" placeholder="Search parts..." class="px-3 py-1.5 rounded text-black text-sm w-32 md:w-64">
    <span id="cartCount" class="bg-yellow-400 text-black px-3 py-1 rounded-full font-bold text-sm">Cart: 0</span>
  </div>
</nav>
<!-- Hero -->
<div class="bg-gradient-to-r from-black to-gray-800 text-white p-8 md:p-16 text-center">
  <h2 class="text-3xl md:text-5xl font-bold mb-2">Genuine Spare Parts</h2>
  <p class="text-gray-300">For Bike, Car, Truck - Best Price in Pune</p>
  <a href="#products" class="inline-block mt-6 bg-yellow-400 text-black px-8 py-3 rounded-full font-bold">Shop Now</a>
</div>
<!-- Products -->
<div id="products" class="p-4 md:p-8 grid grid-cols-2 md:grid-cols-4 gap-4 max-w-7xl mx-auto"></div>
<!-- Checkout -->
<div class="fixed bottom-4 right-4">
  <button onclick="checkout()" class="bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-lg">Checkout via WhatsApp</button>
</div>
<script>
const parts=[
{name:"Brake Pad - Pulsar",price:450,cat:"Bike",img:"https://images.unsplash.com/photo-1558981852-426c6c22a060?w=300"},
{name:"Oil Filter - Swift",price:350,cat:"Car",img:"https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=300"},
{name:"Clutch Plate Set",price:2200,cat:"Car",img:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=300"},
{name:"Air Filter Truck",price:1200,cat:"Truck",img:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=300"},
{name:"Spark Plug NGK",price:180,cat:"Bike",img:"https://images.unsplash.com/photo-1603386329225-868f9b1ee6c9?w=300"},
{name:"Chain Sprocket Kit",price:1800,cat:"Bike",img:"https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=300"},
{name:"Headlight Bulb",price:250,cat:"All",img:"https://images.unsplash.com/photo-1542281286-9e0a16bb7366?w=300"},
{name:"Bumper - Alto",price:3500,cat:"Car",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=300"},
];
let cart=0,cartItems=[];
const grid=document.getElementById('products');
function render(filter=""){
  grid.innerHTML="";
  parts.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())).forEach((p,i)=>{
    grid.innerHTML+=`<div class="bg-white rounded-xl shadow p-3 hover:shadow-xl transition"><img src="${p.img}" class="h-32 w-full object-cover rounded-lg"><div class="mt-2 font-semibold text-sm">${p.name}</div><div class="text-xs text-gray-500">${p.cat}</div><div class="flex justify-between items-center mt-2"><span class="font-bold text-green-600">₹${p.price}</span><button onclick="add(${i})" class="bg-black text-white text-xs px-3 py-1.5 rounded-full">Add +</button></div></div>`;
  });
}
function add(i){cart++;cartItems.push(parts[i]);document.getElementById('cartCount').innerText='Cart: '+cart;}
function checkout(){
  if(cart==0)return alert('Cart khali aahe!');
  let msg=`Hi Trust Spare, mala he parts pahije:%0A${cartItems.map(p=>`- ${p.name} (Rs ${p.price})`).join('%0A')}%0ATotal Items: ${cart}`;
  window.open(`https://wa.me/917744011507?text=${msg}`,'_blank');
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render();
</script>
</body>
</html>
