<!DOCTYPE html>
<html>
<head>
<title>Trust Spare - Login</title>
<style>
body{font-family:Arial; background:#0a4d8c; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:white; padding:30px; border-radius:12px; width:320px; text-align:center;}
h2{color:#0a4d8c;}
input{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#0a4d8c; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;}
</style>
</head>
<body>
<div class="box">
<h2>Trust Spare</h2>
<p>Login to Continue</p>
<input type="text" id="u" placeholder="Username">
<input type="password" id="p" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<script>
function login(){
  var u = document.getElementById('u').value;
  var p = document.getElementById('p').value;
  if(u=="" || p==""){
    alert("Username ani Password taka");
  } else {
    window.location.href = "index.html";
  }
}
</script>
</body>
</html>
