<!DOCTYPE html>
<html>
<head>
<title>Sell Product</title>
<style>
body{font-family:Arial; background:#f2f2f2; margin:0; padding:20px;}
.box{background:white; padding:20px; border-radius:12px; max-width:500px; margin:auto;}
h2{color:#0a4d8c; text-align:center;}
input{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;}
a{display:block; margin-top:10px; text-align:center; color:#0a4d8c; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>Sell Your Product</h2>
<input type="text" placeholder="Product Name">
<input type="number" placeholder="Price ₹">
<input type="text" placeholder="Description">
<button onclick="alert('Product Added Successfully!')">Add Product</button>
<a href="index.html">Back to Home</a>
</div>
</body>
</html>
