<!DOCTYPE html>
<html>
<head>
<title>Trust Spare - Register</title>
<style>
body{font-family:Arial; background:#0a4d8c; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.box{background:white; padding:30px; border-radius:12px; width:320px; text-align:center;}
h2{color:#0a4d8c;}
input{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#0a4d8c; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer;}
a{display:block; margin-top:10px; color:#0a4d8c; text-decoration:none;}
</style>
</head>
<body>
<div class="box">
<h2>Create Account</h2>
<input type="text" placeholder="Full Name">
<input type="text" placeholder="Mobile Number">
<input type="password" placeholder="Password">
<button onclick="window.location.href='login.html'">Register</button>
<a href="login.html">Already have account? Login</a>
</div>
</body>
</html>
